<style>

*{

.window{

}

.w1{left:200px;top:350px}

/* PLAYER */

#player{

}

.body{

}

.leg.left{
left:8px;
}

.leg.right{
right:8px;
}

/* HUD */

#hud{
position:fixed;
top:15px;

z-index:100;
min-width:230px;
padding:14px;
color:white;
background:rgba(0,0,0,.88);
border:2px solid #555;
border-radius:10px;
}

#hud h1{
font-size:20px;
margin-bottom:10px;
}

.stat{
margin:5px 0;
font-size:14px;
}

/* MISSION */

#mission{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
z-index:100;
padding:12px 20px;
color:white;
background:rgba(0,0,0,.88);
border:2px solid #555;
border-radius:10px;
text-align:center;
}

#mission small{
display:block;
color:#aaa;
margin-top:5px;
}

/* MESSAGE */

#message{
position:fixed;
left:50%;
bottom:140px;
transform:translateX(-50%);
z-index:400;
color:white;
background:rgba(0,0,0,.95);
padding:18px 25px;
border-radius:12px;
border:2px solid #666;
text-align:center;
display:none;
min-width:280px;
}

/* MENU */

#menu{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:500;
width:320px;
padding:22px;
background:rgba(15,15,15,.97);
border:3px solid #777;
border-radius:15px;
color:white;
display:none;
text-align:center;
}

#menu h2{
margin-bottom:10px;
}

#menu p{
color:#bbb;
margin-bottom:18px;
}

.menuButton{
width:100%;
padding:13px;
margin:6px 0;
border-radius:10px;
border:2px solid #666;
background:#222;
color:white;
font-size:16px;
}

.menuButton:active{
background:#444;
}

/* CONTROLS */

#controls{
position:fixed;
bottom:20px;
left:20px;
z-index:200;
display:grid;
grid-template-columns:65px 65px 65px;
gap:8px;
}

.control{
width:65px;
height:65px;
border-radius:15px;
border:2px solid #777;
background:rgba(0,0,0,.75);
color:white;
font-size:25px;
touch-action:none;
}

.empty{
visibility:hidden;
}

/* JUMP */

#jump{
position:fixed;
bottom:30px;
right:25px;
z-index:200;
width:90px;
height:90px;
border-radius:50%;
border:3px solid #777;
background:rgba(0,0,0,.75);
color:white;
font-size:18px;
font-weight:bold;
touch-action:none;
}

/* INTERACT */

#interact{
position:fixed;
bottom:135px;
right:25px;
z-index:200;
width:110px;
height:55px;
border-radius:15px;
border:3px solid #aaa;
background:rgba(0,0,0,.9);
color:white;
font-size:14px;
font-weight:bold;
display:none;
touch-action:none;
}

/* DESKTOP */

@media(min-width:800px){

#controls,
#jump,
#interact{
display:none !important;
}

}

</style>

</head>

<body>

<div id="game">

<div id="world">

<div class="sky"></div>


<!-- BUILDINGS -->

<div class="building home">
🏠<br>HOME
</div>

<div class="building shop">
🛒<br>GROCERY<br>STORE
</div>

<div class="building job">
🏢<br>JOB<br>CENTER
</div>

<div class="building bank">
🏦<br>BANK
</div>


<!-- WINDOWS -->

<div class="window w1"></div>
<div class="window w2"></div>
<div class="window w3"></div>
<div class="window w4"></div>
<div class="window w5"></div>
<div class="window w6"></div>
<div class="window w7"></div>
<div class="window w8"></div>


<div class="sidewalk"></div>

<div class="ground"></div>


<!-- ROAD -->

<div class="line line1"></div>
<div class="line line2"></div>
<div class="line line3"></div>
<div class="line line4"></div>
<div class="line line5"></div>
<div class="line line6"></div>
<div class="line line7"></div>
<div class="line line8"></div>
<div class="line line9"></div>


<!-- PLAYER -->

<div id="player">

<div class="head"></div>

<div class="body"></div>

<div class="leg left"></div>

<div class="leg right"></div>

</div>

</div>

</div>


<!-- HUD -->

<div id="hud">

<h1>💀 BANKRUPT</h1>

<div class="stat">
💵 Money: $<span id="money">500</span>
</div>

<div class="stat">
🍔 Hunger: <span id="hunger">100</span>%
</div>

<div class="stat">
⚡ Energy: <span id="energy">100</span>%
</div>

<div class="stat">
💳 Debt: $<span id="debt">0</span>
</div>

<div class="stat">
📅 Day: <span id="day">1</span>
</div>

<div class="stat">
🕐 Time: <span id="time">08:00</span>
</div>

</div>

<div id="mission">

<strong id="missionTitle">
MISSION: FIND A JOB
</strong>

<small id="missionText">

<!-- MENU -->

<h2 id="menuTitle">

</h2>

id="actionButton">
ACTION
</button>

id="closeMenu">

</button>

</div>

<div id="controls">

<button class="control empty"></button>

<button class="control" id="left">
◀
</button>

</button>

<button class="control empty"></button>

</div>

JUMP
</button>


<button id="interact">

</button>


<script>

/* =========================
PLAYER
========================= */

const player =
document.getElementById("player");

const world =
document.getElementById("world");

const interactButton =
document.getElementById("interact");

const message =
document.getElementById("message");

const menu =
document.getElementById("menu");

const menuTitle =
document.getElementById("menuTitle");

const menuText =
document.getElementById("menuText");

const actionButton =
document.getElementById("actionButton");


let x = 350;

let y = 580;

let velocityY = 0;

const speed = 6;

const gravity = 0.8;

const jumpPower = -15;

let onGround = false;


/* GAME STATE */

let jobUnlocked = false;

let workedToday = false;


/* STATS */

let money = 500;

let hunger = 100;

let energy = 100;

let debt = 0;

let day = 1;


/* TIME */

let hour = 8;

let minute = 0;


/* CONTROLS */

const keys = {

left:false,

right:false

};


/* =========================
HUD
========================= */

function updateHUD(){

document.getElementById("money")
.innerText = money;

document.getElementById("hunger")
.innerText = hunger;

document.getElementById("energy")
.innerText = energy;

document.getElementById("debt")
.innerText = debt;

document.getElementById("day")
.innerText = day;

document.getElementById("time")
.innerText =

String(hour).padStart(2,"0")
+
":" +
String(minute).padStart(2,"0");

}


/* =========================
TIME
========================= */

function advanceTime(hours){

hour += hours;

if(hour >= 24){

hour -= 24;

}


/* HUNGER */

hunger =
Math.max(
0,
hunger - (hours * 5)
);


/* ENERGY */

energy =
Math.max(
0,
energy - (hours * 2)
);


/* NIGHT */

updateLighting();

updateHUD();

}


/* =========================
LIGHTING
========================= */

function updateLighting(){

if(hour >= 19 || hour < 6){

world.style.filter =
"brightness(.45)";

}else if(hour >= 17){

world.style.filter =
"brightness(.7)";

}else{

world.style.filter =
"brightness(1)";

}

}


/* =========================
GAME LOOP
========================= */

function update(){

if(keys.left){

x -= speed;

}

if(keys.right){

x += speed;

}


/* GRAVITY */

velocityY += gravity;

y += velocityY;


/* GROUND */

if(y >= 580){

y = 580;

velocityY = 0;

onGround = true;

}else{

onGround = false;

}


/* LIMIT */

x =
Math.max(
0,
Math.min(
2950,
x
)
);


/* POSITION */

player.style.left =
x + "px";

player.style.top =
y + "px";


/* CAMERA */

const screenWidth =
window.innerWidth;

let cameraX =
x - screenWidth / 2;

cameraX =
Math.max(
0,
Math.min(
3000-screenWidth,
cameraX
)
);

world.style.transform =
`translateX(${-cameraX}px)`;


/* INTERACTION */

if(
(x > 1450 && x < 1950) ||
(x > 750 && x < 1250) ||
(x > 50 && x < 500)
){

interactButton.style.display =
"block";

}else{

interactButton.style.display =
"none";

}


requestAnimationFrame(update);

}

update();


/* =========================
JUMP
========================= */

function jump(){

if(onGround){

velocityY =
jumpPower;

onGround = false;

}

}


/* =========================
INTERACT
========================= */

function interact(){

/* HOME */

if(x > 50 && x < 500){

openHome();

return;

}


/* GROCERY */

if(x > 750 && x < 1250){

openGrocery();

return;

}


/* JOB CENTER */

if(x > 1450 && x < 1950){

openJobCenter();

return;

}

}


/* =========================
JOB CENTER
========================= */

function openJobCenter(){

if(!jobUnlocked){

menuTitle.innerText =
"🏢 JOB CENTER";

menuText.innerText =
"Apply for a basic job. Salary: $100/day.";

actionButton.innerText =
"APPLY FOR JOB";

actionButton.onclick =
function(){

jobUnlocked = true;

menu.style.display =
"none";

document.getElementById(
"missionTitle"
).innerText =
"MISSION: WORK";

document.getElementById(
"missionText"
).innerText =
"Return to the Job Center and start your first shift.";

showMessage(
"💼 JOB ACCEPTED<br><br>" +
"Salary: $100/day<br>" +
"Energy cost: 20"
);

};

}else{

menuTitle.innerText =
"🏢 JOB CENTER";

menuText.innerText =
workedToday
?
"You already worked today."
:
"Ready for your shift?";

actionButton.innerText =
workedToday
?
"WORK COMPLETED"
:
"START WORK";

actionButton.onclick =
function(){

if(workedToday){

return;

}

if(energy < 20){

showMessage(
"⚡ You're too tired to work.<br><br>" +
"Go home and sleep."
);

return;

}


/* WORK */

workedToday = true;

money += 100;

energy =
Math.max(
0,
energy - 20
);

hunger =
Math.max(
0,
hunger - 10
);

advanceTime(8);

menu.style.display =
"none";

updateHUD();

showMessage(
"💼 SHIFT COMPLETE<br><br>" +
"Salary received: +$100<br>" +
"Energy: -20<br>" +
"Hunger: -10"
);

document.getElementById(
"missionTitle"
).innerText =
"MISSION: SURVIVE THE DAY";

document.getElementById(
"missionText"
).innerText =
"Buy food if you're hungry, then go home.";

};

}

menu.style.display =
"block";

}


/* =========================
GROCERY
========================= */

function openGrocery(){

menuTitle.innerText =
"🛒 GROCERY STORE";

menuText.innerText =
"Food price: $20";

actionButton.innerText =
"BUY FOOD — $20";

actionButton.onclick =
function(){

if(money < 20){

showMessage(
"❌ NOT ENOUGH MONEY<br><br>" +
"You can't afford food."
);

return;

}

money -= 20;

hunger =
Math.min(
100,
hunger + 40
);

advanceTime(1);

menu.style.display =
"none";

showMessage(
"🍞 FOOD PURCHASED<br><br>" +
"-$20<br>" +
"Hunger restored."
);

};

menu.style.display =
"block";

}


/* =========================
HOME
========================= */

function openHome(){

menuTitle.innerText =
"🏠 HOME";

menuText.innerText =
"Rest and prepare for tomorrow.";

actionButton.innerText =
"SLEEP";

actionButton.onclick =
function(){

/* NEW DAY */

day++;

workedToday = false;

hour = 8;

minute = 0;

energy = 100;

hunger =
Math.max(
0,
hunger - 10
);

menu.style.display =
"none";

updateHUD();

updateLighting();

showMessage(
"🌅 DAY " +
day +
"<br><br>" +
"Another day begins..."
);

document.getElementById(
"missionTitle"
).innerText =
jobUnlocked
?
"MISSION: WORK"
:
"MISSION: FIND A JOB";

document.getElementById(
"missionText"
).innerText =
jobUnlocked
?
"Go to the Job Center."
:
"Go to the Job Center.";

};

menu.style.display =
"block";

}


/* =========================
MESSAGE
========================= */

function showMessage(text){

message.innerHTML =
text;

message.style.display =
"block";

setTimeout(
function(){

message.style.display =
"none";

},
3000
);

}


message.addEventListener(
"click",
function(){

message.style.display =
"none";

}
);


/* =========================
KEYBOARD
========================= */

document.addEventListener(
"keydown",
function(e){

if(
e.key === "ArrowLeft" ||
e.key === "a"
){

keys.left = true;

}

if(
e.key === "ArrowRight" ||
e.key === "d"
){

keys.right = true;

}

if(
e.key === "ArrowUp" ||
e.key === "w" ||
e.key === " "
){

jump();

}

if(e.key === "Enter"){

interact();

}

}
);


document.addEventListener(
"keyup",
function(e){

if(
e.key === "ArrowLeft" ||
e.key === "a"
){

keys.left = false;

}

if(
e.key === "ArrowRight" ||
e.key === "d"
){

keys.right = false;

}

}
);


/* =========================
MOBILE MOVEMENT
========================= */

function holdButton(
id,
direction
){

const button =
document.getElementById(id);

button.addEventListener(
"touchstart",
function(e){

e.preventDefault();

keys[direction] = true;

}
);

button.addEventListener(
"touchend",
function(e){

e.preventDefault();

keys[direction] = false;

}
);

button.addEventListener(
"mousedown",
function(){

keys[direction] = true;

}
);

button.addEventListener(
"mouseup",
function(){

keys[direction] = false;

}
);

}


holdButton(
"left",
"left"
);

holdButton(
"right",
"right"
);


/* =========================
MOBILE JUMP
========================= */

document.getElementById(
"jump"
).addEventListener(
"touchstart",
function(e){

e.preventDefault();

jump();

}
);

document.getElementById(
"jump"
).addEventListener(
"click",
function(){

jump();

}
);


/* =========================
MOBILE INTERACT
========================= */

interactButton.addEventListener(
"touchstart",
function(e){

e.preventDefault();

interact();

}
);

interactButton.addEventListener(
"click",
function(){

interact();

}
);


/* INITIAL */

updateHUD();

updateLighting();

</script>

</body>
</html>
```
