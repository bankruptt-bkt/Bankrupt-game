<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BANKRUPTT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #0b0d14; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; }
    
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* Top HUD */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      background: rgba(15, 18, 30, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      padding: 10px 14px;
      border-radius: 12px;
      z-index: 10;
    }
    .metric { display: flex; flex-direction: column; gap: 2px; }
    .metric-title { font-size: 9px; color: #8a99ad; text-transform: uppercase; letter-spacing: 0.6px; }
    .metric-value { font-size: 15px; font-weight: 700; }
    .status-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
      align-self: center;
    }
    .status-stable { background: #2a9d8f; color: #fff; }
    .status-struggling { background: #e9c46a; color: #111; }
    .status-debt { background: #f4a261; color: #111; }
    .status-broke { background: #e76f51; color: #fff; }
    .status-bankrupt { background: #d90429; color: #fff; }

    /* Action Deck */
    #action-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: 95%;
      max-width: 560px;
      background: rgba(15, 18, 30, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      z-index: 10;
    }
    button.game-btn {
      background: #1f293d;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    button.game-btn:active { background: #3b82f6; transform: scale(0.96); }
    button.game-btn small { font-size: 8px; color: #9ca3af; text-align: center; }

    /* Modals & Dialogs */
    .modal-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      max-width: 440px;
      background: #151928;
      border: 1px solid #3b82f6;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.95);
      z-index: 20;
      display: none;
    }
    .modal-header { font-size: 17px; color: #60a5fa; margin-bottom: 8px; font-weight: 700; }
    .modal-body { font-size: 13px; line-height: 1.5; color: #d1d5db; margin-bottom: 16px; }
    .modal-choices { display: flex; flex-direction: column; gap: 8px; }
    .modal-choices button {
      background: #20273d;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      line-height: 1.35;
    }
    .modal-choices button:hover { background: #3b82f6; }
    .btn-action {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-action:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div id="hud">
    <div class="metric">
      <span class="metric-title">Date</span>
      <span id="date-val" class="metric-value">Jan 2008</span>
    </div>
    <div class="metric">
      <span class="metric-title">Cash</span>
      <span id="cash-val" class="metric-value" style="color: #4ade80;">$1,200</span>
    </div>
    <div class="metric">
      <span class="metric-title">Debt</span>
      <span id="debt-val" class="metric-value" style="color: #f87171;">$2,500</span>
    </div>
    <div class="metric">
      <span class="metric-title">Bitcoin</span>
      <span id="btc-val" class="metric-value" style="color: #f59e0b;">0 BTC</span>
    </div>
    <div class="metric">
      <span class="metric-title">BTC Price</span>
      <span id="btc-price" class="metric-value" style="color: #fbbf24;">$0.00</span>
    </div>
    <div class="metric">
      <span class="metric-title">Energy</span>
      <span id="energy-val" class="metric-value">100%</span>
    </div>
    <div id="status-val" class="status-badge status-struggling">STRUGGLING</div>
  </div>

  <div id="canvas-container"></div>

  <div id="action-bar">
    <button class="game-btn" onclick="game.work()">
      💼 Work
      <small>+$420, -25%</small>
    </button>
    <button class="game-btn" onclick="game.rest()">
      ☕ Rest
      <small>-$50, +30%</small>
    </button>
    <button class="game-btn" onclick="game.payDebt()">
      💳 Pay Debt
      <small>-$300 Debt</small>
    </button>
    <button class="game-btn" onclick="game.openTradeModal()">
      ₿ Trade BTC
      <small>Buy / Sell</small>
    </button>
    <button class="game-btn" onclick="game.endMonth()">
      🗓️ End Month
      <small>Pay Rent/Bills</small>
    </button>
  </div>

  <!-- Event Dialog -->
  <div id="event-modal" class="modal-overlay">
    <div id="modal-title" class="modal-header">Macro Event</div>
    <div id="modal-desc" class="modal-body">Event details...</div>
    <div id="modal-choices" class="modal-choices"></div>
  </div>

  <!-- Trade Dialog -->
  <div id="trade-modal" class="modal-overlay">
    <div class="modal-header">₿ Bitcoin Ledger</div>
    <div id="trade-body" class="modal-body">Current BTC Price: $0.00</div>
    <div class="modal-choices">
      <button onclick="game.buyBTC(100)">Buy $100 of BTC</button>
      <button onclick="game.buyBTC(500)">Buy $500 of BTC</button>
      <button onclick="game.sellBTC(0.5)">Sell 50% of Holdings</button>
      <button onclick="game.sellBTC(1.0)">Sell 100% of Holdings</button>
    </div>
    <button class="btn-action" style="background: #374151;" onclick="document.getElementById('trade-modal').style.display='none'">Close</button>
  </div>

  <!-- Game Over / Victory Summary Screen -->
  <div id="ending-modal" class="modal-overlay">
    <div id="ending-title" class="modal-header" style="font-size: 20px;">Game Over</div>
    <div id="ending-desc" class="modal-body" style="font-size: 14px;">Summary...</div>
    <div id="ending-stats" class="modal-body" style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; font-family: monospace;"></div>
    <button class="btn-action" onclick="game.restart()">🔄 Start New Journey</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // 3D Scene Initialization
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c13);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(13, 11, 13);
    camera.lookAt(0, 1.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x28324e, 1.2));
    const ceilingLight = new THREE.PointLight(0xffecd1, 1.8, 14);
    ceilingLight.position.set(0, 6, 0);
    ceilingLight.castShadow = true;
    scene.add(ceilingLight);

    const monitorLight = new THREE.PointLight(0x38bdf8, 2.2, 4);
    monitorLight.position.set(-2, 2.4, -2.4);
    scene.add(monitorLight);

    const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.4, 9), new THREE.MeshStandardMaterial({ color: 0x221a15 }));
    floor.position.y = -0.2;
    floor.receiveShadow = true;
    scene.add(floor);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x242d38 });
    const backWall1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 6, 9), wallMat);
    backWall1.position.set(-4.5, 2.8, 0);
    scene.add(backWall1);

    const backWall2 = new THREE.Mesh(new THREE.BoxGeometry(9, 6, 0.3), wallMat);
    backWall2.position.set(0, 2.8, -4.5);
    scene.add(backWall2);

    const desk = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.4, 1.6), new THREE.MeshStandardMaterial({ color: 0x3e2723 }));
    desk.position.set(-2.4, 0.7, -2.8);
    scene.add(desk);

    const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.8), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
    screen.position.set(-2.4, 1.9, -3.04);
    scene.add(screen);

    const characterGroup = new THREE.Group();
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.5), new THREE.MeshStandardMaterial({ color: 0x3b82f6 }));
    torso.position.set(0, 1.5, 0);
    characterGroup.add(torso);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0xe0a98b }));
    head.position.set(0, 2.2, 0);
    characterGroup.add(head);

    characterGroup.position.set(-2.4, 0, -1.6);
    scene.add(characterGroup);

    const billGroup = new THREE.Group();
    const paperMat = new THREE.MeshStandardMaterial({ color: 0xfef08a });
    for (let i = 0; i < 6; i++) {
      const paper = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.5), paperMat);
      paper.rotation.x = -Math.PI / 2;
      paper.rotation.z = (Math.random() - 0.5) * 1.5;
      paper.position.set(-1.4 + (Math.random() - 0.5) * 0.4, 0.02 + i * 0.005, -2.6 + (Math.random() - 0.5) * 0.4);
      billGroup.add(paper);
    }
    scene.add(billGroup);

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      torso.position.y = 1.5 + Math.sin(t * 2) * 0.02;
      head.position.y = 2.2 + Math.sin(t * 2) * 0.02;
      monitorLight.intensity = 2.0 + Math.sin(t * 6) * 0.3;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Complete Game State Engine
    class BankruptGame {
      constructor() {
        this.months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        this.restart();
      }

      restart() {
        this.year = 2008;
        this.monthIndex = 0;
        this.cash = 1200;
        this.debt = 2500;
        this.energy = 100;
        this.rent = 600;
        this.livingCost = 250;
        this.salary = 420;
        this.debtInterest = 0.03;
        this.btcHoldings = 0;
        this.btcPrice = 0.00;
        this.isGameOver = false;

        document.getElementById('ending-modal').style.display = 'none';
        document.getElementById('event-modal').style.display = 'none';
        document.getElementById('trade-modal').style.display = 'none';

        this.initTimeline();
        this.updateHUD();
      }

      initTimeline() {
        this.timelineEvents = [
          {
            year: 2008, month: "Sep",
            title: "Lehman Brothers Collapses (Sep 2008)",
            desc: "Global financial crisis erupts. Credit markets freeze worldwide. Your landlord raises rent to service his adjustable-rate loans.",
            choices: [
              { text: "Accept rent hike and work extra (+Rent, -Energy)", action: () => { this.rent += 150; this.energy -= 25; } },
              { text: "Cut food and living budget strictly (-Living Cost)", action: () => { this.livingCost -= 60; this.energy -= 15; } }
            ]
          },
          {
            year: 2009, month: "Jan",
            title: "The Times 03/Jan/2009 Bailout",
            desc: "Headline: 'Chancellor on brink of second bailout for banks.' An anonymous cypherpunk publishes Bitcoin. You can mine it on your home PC for pennies.",
            choices: [
              { text: "Ignore it: 'Just nerdy internet play-money.'", action: () => {} },
              { text: "Run node & CPU miner (-$50 Electricity, +100 BTC)", action: () => { this.cash -= 50; this.btcHoldings += 100; } }
            ]
          },
          {
            year: 2010, month: "May",
            title: "10,000 BTC for Two Pizzas (May 2010)",
            desc: "A programmer trades 10,000 Bitcoins for two pizzas. Bitcoin establishes open market pricing at ~$0.004.",
            choices: [
              { text: "Laugh off the pizza story and keep working", action: () => {} },
              { text: "Buy $40 worth of BTC (~10,000 BTC)", action: () => { if(this.cash >= 40) { this.cash -= 40; this.btcHoldings += 10000; } } }
            ]
          },
          {
            year: 2011, month: "Jun",
            title: "The First Parabolic Spike ($30 BTC)",
            desc: "Bitcoin surges to $30. Media calls it a bubble. General inflation makes groceries more expensive.",
            choices: [
              { text: "Focus entirely on paying down credit cards", action: () => { this.payDebt(); } },
              { text: "Research Bitcoin whitepaper and secure self-custody", action: () => { this.energy -= 10; } }
            ]
          },
          {
            year: 2013, month: "Mar",
            title: "Cyprus Banking Haircut (Mar 2013)",
            desc: "Cyprus banks seize depositor savings to bail out institutions. Bitcoin surges to $1,000.",
            choices: [
              { text: "Keep all emergency savings in traditional bank account", action: () => {} },
              { text: "Buy $200 worth of Bitcoin as an alternative ledger", action: () => { this.buyBTC(200); } }
            ]
          },
          {
            year: 2017, month: "Dec",
            title: "Retail Euphoria ($20,000 BTC)",
            desc: "Bitcoin crosses $19,000. Everyone asks if they should take loans to speculate.",
            choices: [
              { text: "Borrow $2,000 on credit to buy BTC (High Risk)", action: () => { this.debt += 2000; this.buyBTC(2000); } },
              { text: "Sell some BTC to wipe out lingering personal debt", action: () => { this.sellBTC(0.5); } },
              { text: "HODL and manage daily fiat budget normally", action: () => {} }
            ]
          },
          {
            year: 2018, month: "Nov",
            title: "Crypto Winter (-80% Crash)",
            desc: "Bitcoin plummets toward $3,200. Pundits declare Bitcoin dead. Living costs remain elevated.",
            choices: [
              { text: "Panic and sell entire BTC balance at bottom", action: () => { this.sellBTC(1.0); } },
              { text: "Tune out noise and keep surviving the fiat grind", action: () => {} }
            ]
          },
          {
            year: 2020, month: "Mar",
            title: "Global Lockdowns & Massive Fiat Printing",
            desc: "Trillions printed in stimulus. Supply chains disrupt and real inflation hits hard (+25% Living Cost).",
            choices: [
              { text: "Absorb inflation shock to your monthly budget", action: () => { this.livingCost += 120; } },
              { text: "Allocate surplus fiat cash into hard money", action: () => { this.buyBTC(300); } }
            ]
          },
          {
            year: 2021, month: "Nov",
            title: "The Sound Money Thesis ($69,000 BTC)",
            desc: "Institutions and nation-states hold Bitcoin on their balance sheets.",
            choices: [
              { text: "Evaluate your lifetime financial standing", action: () => { this.evaluateGameEnding(); } }
            ]
          }
        ];

        this.microEvents = [
          { title: "Car Breakdown", desc: "Your vehicle radiator burst. Pay $280 for emergency repairs or take the bus (-15% Energy).", choices: [{ text: "Pay $280", act: () => this.cash -= 280 }, { text: "Take the bus (-Energy)", act: () => this.energy -= 15 }] },
          { title: "Dental Emergency", desc: "A severe tooth infection requires urgent treatment ($220).", choices: [{ text: "Pay dentist (-$220)", act: () => this.cash -= 220 }] },
          { title: "Freelance Side Gig", desc: "A client offers a weekend freelance gig.", choices: [{ text: "Work the weekend (+$300, -20% Energy)", act: () => { this.cash += 300; this.energy -= 20; } }, { text: "Pass to rest", act: () => {} }] },
          { title: "Utility Price Hike", desc: "Electricity and heating rates increase by 10%.", choices: [{ text: "Adjust budget", act: () => this.livingCost += 25 }] }
        ];
      }

      getBTCPrice() {
        if (this.year < 2010) return 0.00;
        if (this.year === 2010) return 0.004;
        if (this.year === 2011) return 15;
        if (this.year === 2012) return 10;
        if (this.year === 2013) return 800;
        if (this.year === 2014) return 350;
        if (this.year === 2015) return 250;
        if (this.year === 2016) return 600;
        if (this.year === 2017) return 15000;
        if (this.year === 2018) return 3800;
        if (this.year === 2019) return 7500;
        if (this.year === 2020) return 18000;
        if (this.year >= 2021) return 55000;
        return 0;
      }

      updateHUD() {
        this.btcPrice = this.getBTCPrice();
        document.getElementById('date-val').innerText = `${this.months[this.monthIndex]} ${this.year}`;
        document.getElementById('cash-val').innerText = `$${Math.round(this.cash).toLocaleString()}`;
        document.getElementById('debt-val').innerText = `$${Math.round(this.debt).toLocaleString()}`;
        document.getElementById('btc-val').innerText = `${this.btcHoldings.toFixed(2)} BTC`;
        document.getElementById('btc-price').innerText = this.btcPrice > 0 ? `$${this.btcPrice.toLocaleString()}` : '$0.00';
        document.getElementById('energy-val').innerText = `${Math.max(0, this.energy)}%`;

        const totalNetWorth = (this.cash + (this.btcHoldings * this.btcPrice)) - this.debt;
        const statusEl = document.getElementById('status-val');
        statusEl.className = "status-badge ";

        if (this.debt > 6000 && this.cash <= 0 && (this.btcHoldings * this.btcPrice) < 500) {
          statusEl.innerText = "BANKRUPTT";
          statusEl.classList.add("status-bankrupt");
          billGroup.visible = true;
          this.triggerGameOver("BANKRUPTT: You were crushed under the compounding weight of debt and fiat inflation.");
        } else if (totalNetWorth > 50000) {
          statusEl.innerText = "SOVEREIGN";
          statusEl.classList.add("status-stable");
          billGroup.visible = false;
        } else if (this.cash < 200 || this.debt > 3000) {
          statusEl.innerText = "BROKE";
          statusEl.classList.add("status-broke");
          billGroup.visible = true;
        } else if (this.debt > 1500) {
          statusEl.innerText = "IN DEBT";
          statusEl.classList.add("status-debt");
          billGroup.visible = true;
        } else if (this.cash < 1000) {
          statusEl.innerText = "STRUGGLING";
          statusEl.classList.add("status-struggling");
          billGroup.visible = false;
        } else {
          statusEl.innerText = "STABLE";
          statusEl.classList.add("status-stable");
          billGroup.visible = false;
        }
      }

      work() {
        if (this.isGameOver) return;
        if (this.energy <= 10) {
          alert("Burnout collapse! You worked while completely exhausted. An emergency clinic visit cost you $200.");
          this.cash -= 200;
          this.energy = 30;
          this.updateHUD();
          return;
        }
        this.cash += this.salary;
        this.energy -= 25;
        this.updateHUD();
      }

      rest() {
        if (this.isGameOver) return;
        if (this.cash < 50) { alert("Not enough money for groceries."); return; }
        this.cash -= 50;
        this.energy = Math.min(100, this.energy + 30);
        this.updateHUD();
      }

      payDebt() {
        if (this.isGameOver) return;
        if (this.cash < 300) { alert("Need at least $300 cash."); return; }
        this.cash -= 300;
        this.debt = Math.max(0, this.debt - 300);
        this.updateHUD();
      }

      openTradeModal() {
        if (this.isGameOver) return;
        if (this.year < 2009) { alert("Bitcoin has not launched yet."); return; }
        document.getElementById('trade-body').innerText = `BTC Price: $${this.btcPrice.toLocaleString()} | Your Holdings: ${this.btcHoldings.toFixed(4)} BTC ($${Math.round(this.btcHoldings * this.btcPrice).toLocaleString()})`;
        document.getElementById('trade-modal').style.display = 'block';
      }

      buyBTC(usdAmount) {
        if (this.cash < usdAmount) { alert("Not enough fiat cash."); return; }
        if (this.btcPrice <= 0) { alert("Bitcoin is not yet traded on open markets."); return; }
        this.cash -= usdAmount;
        this.btcHoldings += (usdAmount / this.btcPrice);
        document.getElementById('trade-modal').style.display = 'none';
        this.updateHUD();
      }

      sellBTC(percentage) {
        if (this.btcHoldings <= 0) { alert("No Bitcoin to sell."); return; }
        const sellAmount = this.btcHoldings * percentage;
        const fiatGained = sellAmount * this.btcPrice;
        this.btcHoldings -= sellAmount;
        this.cash += fiatGained;
        document.getElementById('trade-modal').style.display = 'none';
        this.updateHUD();
      }

      endMonth() {
        if (this.isGameOver) return;

        // Debt compound interest
        if (this.debt > 0) this.debt += Math.round(this.debt * this.debtInterest);

        // Deduct monthly rent & living expenses
        this.cash -= (this.rent + this.livingCost);

        // Emergency credit if out of cash
        if (this.cash < 0) {
          this.debt += Math.abs(this.cash);
          this.cash = 0;
        }

        // Advance calendar
        this.monthIndex++;
        if (this.monthIndex >= 12) {
          this.monthIndex = 0;
          this.year++;
          // Dynamic Yearly Inflation
          this.rent += Math.round(this.rent * 0.04);
          this.livingCost += Math.round(this.livingCost * 0.05);
          this.salary += Math.round(this.salary * 0.02); // Wages lag behind inflation
        }

        this.energy = Math.min(100, this.energy + 10);
        this.updateHUD();

        // Check Macro or Random Events
        this.checkEvents();
      }

      checkEvents() {
        const currentMonthName = this.months[this.monthIndex];
        const macro = this.timelineEvents.find(e => e.year === this.year && e.month === currentMonthName);
        
        if (macro) {
          this.showModal(macro.title, macro.desc, macro.choices);
        } else if (Math.random() < 0.22) { // 22% chance of micro-life event
          const randomEv = this.microEvents[Math.floor(Math.random() * this.microEvents.length)];
          const formattedChoices = randomEv.choices.map(c => ({ text: c.text, action: c.act }));
          this.showModal(randomEv.title, randomEv.desc, formattedChoices);
        }
      }

      showModal(title, desc, choices) {
        const modal = document.getElementById('event-modal');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-desc').innerText = desc;
        const choicesContainer = document.getElementById('modal-choices');
        choicesContainer.innerHTML = "";

        choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.innerText = choice.text;
          btn.onclick = () => {
            choice.action();
            modal.style.display = "none";
            this.updateHUD();
          };
          choicesContainer.appendChild(btn);
        });

        modal.style.display = "block";
      }

      triggerGameOver(reason) {
        this.isGameOver = true;
        document.getElementById('ending-title').innerText = "💀 GAME OVER: BANKRUPTT";
        document.getElementById('ending-desc').innerText = reason;
        document.getElementById('ending-stats').innerHTML = `
          Year Reached: ${this.year}<br>
          Final Cash: $${Math.round(this.cash)}<br>
          Final Debt: $${Math.round(this.debt)}<br>
          BTC Stack: ${this.btcHoldings.toFixed(2)} BTC
        `;
        document.getElementById('ending-modal').style.display = 'block';
      }

      evaluateGameEnding() {
        this.isGameOver = true;
        const btcValue = this.btcHoldings * this.btcPrice;
        const netWorth = Math.round((this.cash + btcValue) - this.debt);

        if (netWorth > 100000) {
          document.getElementById('ending-title').innerText = "👑 VICTORY: FINANCIAL SOVEREIGNTY";
          document.getElementById('ending-desc').innerText = "You survived over a decade of currency debasement, bank bailouts, and debt traps. By recognizing sound money early and holding through brutal volatility, you decoupled your financial life from broken fiat rules.";
        } else {
          document.getElementById('ending-title').innerText = "🏃 THE RAT RACE ENDING";
          document.getElementById('ending-desc').innerText = "You survived until 2021, but remained entirely within the traditional fiat system. As inflation accelerated and living costs multiplied, you worked harder every single year just to stay in the exact same place.";
        }

        document.getElementById('ending-stats').innerHTML = `
          Total Net Worth: $${netWorth.toLocaleString()}<br>
          Remaining Debt: $${Math.round(this.debt).toLocaleString()}<br>
          Bitcoin Stack: ${this.btcHoldings.toFixed(4)} BTC ($${Math.round(btcValue).toLocaleString()})
        `;
        document.getElementById('ending-modal').style.display = 'block';
      }
    }

    window.game = new BankruptGame();
  </script>
</body>
</html>
