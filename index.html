<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

    <title>BANKRUPT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="brand">
            BANKRUPT
            <small>SURVIVE THE ECONOMY</small>
        </div>

        <div class="date">
            <b id="date">JAN 2019</b>
            <span id="time">08:00</span>
        </div>

        <div class="stats">
            <span>💰 <b id="cash">₹40,000</b></span>
            <span>❤️ <b id="health">100</b></span>
            <span>😰 <b id="stress">10</b></span>
        </div>

    </div>


    <div id="message">
        Welcome to your life.
    </div>


    <div id="interaction">

        <div id="interactionText">
            PRESS E TO INTERACT
        </div>

    </div>


    <!-- MOBILE CONTROLS -->

    <div id="controls">

        <button id="up">▲</button>

        <div>
            <button id="left">◀</button>
            <button id="down">▼</button>
            <button id="right">▶</button>
        </div>

    </div>


    <button id="interact">
        INTERACT
    </button>

</div>

<script src="game.js"></script>

</body>
</html>
