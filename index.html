/* ROAD */

.line1{left:200px}

.building{
position:absolute;

.window{
position:absolute;

}

.w1{left:200px;top:350px}

.w3{left:900px;top:350px}

}

.body{

.leg{

border:2px solid #111;
}

.leg.left{
left:8px;
}

.leg.right{
right:8px;
}

/* HUD */

#hud{
position:fixed;
top:15px;
left:15px;
z-index:100;
min-width:220px;
padding:14px;
color:white;
background:rgba(0,0,0,.88);
border:2px solid #555;
border-radius:10px;
}

#hud h1{
font-size:20px;
margin-bottom:10px;
}

.stat{
margin:5px 0;
font-size:14px;
}

/* MISSION */

#mission{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
z-index:100;
padding:12px 20px;
color:white;
background:rgba(0,0,0,.88);
border:2px solid #555;
border-radius:10px;
text-align:center;
}

#mission small{
display:block;
color:#aaa;
margin-top:5px;
}

/* MESSAGE */

#message{
position:fixed;
left:50%;
bottom:140px;
transform:translateX(-50%);
z-index:300;
color:white;
background:rgba(0,0,0,.94);
padding:18px 25px;
border-radius:12px;
border:2px solid #666;
text-align:center;
display:none;
}

/* CONTROLS */

#controls{
position:fixed;
bottom:20px;
left:20px;
z-index:200;
display:grid;
grid-template-columns:65px 65px 65px;
gap:8px;
}

.control{
width:65px;
height:65px;
border-radius:15px;
border:2px solid #777;
background:rgba(0,0,0,.75);
color:white;
font-size:25px;
touch-action:none;
}

.empty{
visibility:hidden;
}

/* JUMP */

#jump{
position:fixed;
bottom:30px;
right:25px;
z-index:200;
width:90px;
height:90px;
border-radius:50%;
border:3px solid #777;
background:rgba(0,0,0,.75);
color:white;
font-size:18px;
font-weight:bold;
touch-action:none;
}

/* INTERACT */

#interact{
position:fixed;
bottom:135px;
right:25px;
z-index:200;
width:110px;
height:55px;
border-radius:15px;
border:3px solid #aaa;
background:rgba(0,0,0,.9);
color:white;
font-size:14px;
font-weight:bold;
display:none;
touch-action:none;
}

/* DESKTOP */

@media(min-width:800px){

#controls,
#jump,
#interact{
display:none !important;
}

}

</style>

</head>

<body>

<div id="game">

<div id="world">

<div class="sky"></div>

<!-- BUILDINGS -->

<div class="building home">
🏠<br>HOME
</div>

<div class="building shop">
🛒<br>GROCERY<br>STORE

<div class="window w5"></div>
<div class="window w6"></div>

<div class="window w8"></div>

<!-- WORLD -->

<div class="sidewalk"></div>

<div class="ground"></div>

<div class="line line1"></div>
<div class="line line2"></div>
<div class="line line3"></div>
<div class="line line4"></div>
<div class="line line5"></div>
<div class="line line6"></div>
<div class="line line7"></div>
<div class="line line8"></div>
<div class="line line9"></div>

<!-- PLAYER -->

<div id="player">

<div class="head"></div>

<div class="body"></div>

<div class="leg left"></div>

<div class="leg right"></div>

</div>

</div>

</div>


<!-- HUD -->

<div id="hud">

<h1>💀 BANKRUPT</h1>

<div class="stat">
💵 Money: $<span id="money">500</span>
</div>

<div class="stat">
🍔 Hunger: <span id="hunger">100</span>%
</div>

<div class="stat">
⚡ Energy: <span id="energy">100</span>%
</div>

<div class="stat">
💳 Debt: $<span id="debt">0</span>
</div>

<div class="stat">
📅 Day: <span id="day">1</span>
</div>

</div>


<!-- MISSION -->

<div id="mission">

<strong id="missionTitle">
MISSION: FIND A JOB
</strong>

<small id="missionText">
Walk right → Job Center
</small>

</div>


<!-- MESSAGE -->

<div id="message"></div>


<!-- MOBILE CONTROLS -->

<div id="controls">

<button class="control empty"></button>

<button class="control" id="left">
◀
</button>

<button class="control empty"></button>

<button class="control empty"></button>

<button class="control" id="right">
▶
</button>

<button class="control empty"></button>

</div>


<button id="jump">
JUMP
</button>


<button id="interact">
INTERACT
</button>


<script>

/* =========================
PLAYER
========================= */

const player =
document.getElementById("player");

const world =
document.getElementById("world");

const interactButton =
document.getElementById("interact");

const message =
document.getElementById("message");

let x = 350;

let y = 580;

let velocityY = 0;

const speed = 6;

const gravity = 0.8;

const jumpPower = -15;

let onGround = false;

let jobUnlocked = false;


/* =========================
GAME STATS
========================= */

let money = 500;

let hunger = 100;

let energy = 100;

let debt = 0;

let day = 1;


/* =========================
CONTROLS
========================= */

const keys = {

left:false,

right:false

};


/* =========================
UPDATE HUD
========================= */

function updateHUD(){

document.getElementById("money")
.innerText = money;

document.getElementById("hunger")
.innerText = hunger;

document.getElementById("energy")
.innerText = energy;

document.getElementById("debt")
.innerText = debt;

document.getElementById("day")
.innerText = day;

}


/* =========================
GAME LOOP
========================= */

function update(){

/* MOVEMENT */

if(keys.left){

x -= speed;

}

if(keys.right){

x += speed;

}


/* GRAVITY */

velocityY += gravity;

y += velocityY;


/* GROUND */

if(y >= 580){

y = 580;

velocityY = 0;

onGround = true;

}else{

onGround = false;

}


/* WORLD LIMIT */

x = Math.max(
0,
Math.min(2950,x)
);


/* PLAYER POSITION */

player.style.left =
x + "px";

player.style.top =
y + "px";


/* CAMERA */

const screenWidth =
window.innerWidth;

let cameraX =
x - screenWidth / 2;

cameraX =
Math.max(
0,
Math.min(
3000-screenWidth,
cameraX
)
);

world.style.transform =
`translateX(${-cameraX}px)`;


/* =========================
JOB CENTER DETECTION
========================= */

if(
x > 1450 &&
x < 1950
){

interactButton.style.display =
"block";

}else{

interactButton.style.display =
"none";

}


/* =========================
GROCERY DETECTION
========================= */

if(
x > 750 &&
x < 1250
){

/* nothing yet */

}


requestAnimationFrame(update);

}

update();


/* =========================
JUMP
========================= */

function jump(){

if(onGround){

velocityY =
jumpPower;

onGround = false;

}

}


/* =========================
INTERACT
========================= */

function interact(){

if(
x > 1450 &&
x < 1950
){

if(!jobUnlocked){

jobUnlocked = true;

message.innerHTML =

"📄 <b>JOB APPLICATION</b><br><br>" +

"You have been accepted for work.<br><br>" +

"💼 Daily salary: $100<br>" +

"⚡ Energy cost: 20";

message.style.display =
"block";


document.getElementById(
"missionTitle"
).innerText =
"MISSION COMPLETE";


document.getElementById(
"missionText"
).innerText =
"Return home to begin your first working day.";


}else{

message.innerHTML =

"💼 <b>JOB CENTER</b><br><br>" +

"You already have a job.";

message.style.display =
"block";

}

}

}


/* =========================
KEYBOARD
========================= */

document.addEventListener(
"keydown",
function(e){

if(
e.key === "ArrowLeft" ||
e.key === "a"
){

keys.left = true;

}


if(
e.key === "ArrowRight" ||
e.key === "d"
){

keys.right = true;

}


if(
e.key === "ArrowUp" ||
e.key === "w" ||
e.key === " "
){

jump();

}


if(e.key === "Enter"){

interact();

}

});


document.addEventListener(
"keyup",
function(e){

if(
e.key === "ArrowLeft" ||
e.key === "a"
){

keys.left = false;

}


if(
e.key === "ArrowRight" ||
e.key === "d"
){

keys.right = false;

}

});


/* =========================
MOBILE MOVEMENT
========================= */

function holdButton(
id,
direction
){

const button =
document.getElementById(id);


button.addEventListener(
"touchstart",
function(e){

e.preventDefault();

keys[direction] = true;

}
);


button.addEventListener(
"touchend",
function(e){

e.preventDefault();

keys[direction] = false;

}
);


button.addEventListener(
"mousedown",
function(){

keys[direction] = true;

}
);


button.addEventListener(
"mouseup",
function(){

keys[direction] = false;

}
);

}


holdButton(
"left",
"left"
);

holdButton(
"right",
"right"
);


/* =========================
MOBILE JUMP
========================= */

document.getElementById(
"jump"
)
.addEventListener(
"touchstart",
function(e){

e.preventDefault();

jump();

}
);


document.getElementById(
"jump"
)
.addEventListener(
"click",
function(){

jump();

}
);


/* =========================
MOBILE INTERACT
========================= */

interactButton.addEventListener(
"touchstart",
function(e){

e.preventDefault();

interact();

}
);


interactButton.addEventListener(
"click",
function(){

interact();

}
);


/* =========================
CLOSE MESSAGE
========================= */

message.addEventListener(
"click",
function(){

message.style.display =
"none";

});


/* INITIAL HUD */

updateHUD();

</script>

</body>

</html>
