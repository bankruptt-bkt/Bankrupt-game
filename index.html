<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BANKRUPTT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #0b0d14; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; }
    
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* Top HUD / Status Bar */
    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 18, 30, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-radius: 12px;
      z-index: 10;
    }
    .metric { display: flex; flex-direction: column; gap: 2px; }
    .metric-title { font-size: 10px; color: #8a99ad; text-transform: uppercase; letter-spacing: 0.6px; }
    .metric-value { font-size: 16px; font-weight: 700; }
    .status-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .status-stable { background: #2a9d8f; color: #fff; }
    .status-struggling { background: #e9c46a; color: #111; }
    .status-debt { background: #f4a261; color: #111; }
    .status-broke { background: #e76f51; color: #fff; }
    .status-bankrupt { background: #d90429; color: #fff; }

    /* Action Deck / Controls */
    #action-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      width: 92%;
      max-width: 480px;
      background: rgba(15, 18, 30, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      z-index: 10;
    }
    button.game-btn {
      flex: 1;
      background: #1f293d;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 6px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    button.game-btn:active { background: #3b82f6; transform: scale(0.96); }
    button.game-btn small { font-size: 9px; color: #9ca3af; }

    /* Modal / Event Dialog */
    #event-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 420px;
      background: #151928;
      border: 1px solid #3b82f6;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      z-index: 20;
      display: none;
    }
    #event-modal h2 { margin-bottom: 8px; font-size: 17px; color: #60a5fa; }
    #event-modal p { font-size: 13px; line-height: 1.45; color: #d1d5db; margin-bottom: 16px; }
    .modal-choices { display: flex; flex-direction: column; gap: 8px; }
    .modal-choices button {
      background: #20273d;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
    }
    .modal-choices button:hover { background: #3b82f6; }
  </style>
</head>
<body>

  <div id="hud">
    <div class="metric">
      <span class="metric-title">Date</span>
      <span id="date-val" class="metric-value">Jan 2008</span>
    </div>
    <div class="metric">
      <span class="metric-title">Cash</span>
      <span id="cash-val" class="metric-value" style="color: #4ade80;">$1,200</span>
    </div>
    <div class="metric">
      <span class="metric-title">Debt</span>
      <span id="debt-val" class="metric-value" style="color: #f87171;">$2,500</span>
    </div>
    <div class="metric">
      <span class="metric-title">Energy</span>
      <span id="energy-val" class="metric-value">100%</span>
    </div>
    <div class="metric">
      <span class="metric-title">Status</span>
      <span id="status-val" class="status-badge status-struggling">STRUGGLING</span>
    </div>
  </div>

  <div id="canvas-container"></div>

  <div id="action-bar">
    <button class="game-btn" onclick="game.work()">
      💼 Work
      <small>+$350, -25%</small>
    </button>
    <button class="game-btn" onclick="game.rest()">
      ☕ Eat & Rest
      <small>-$40, +30%</small>
    </button>
    <button class="game-btn" onclick="game.payDebt()">
      💳 Pay Debt
      <small>-$300 Debt</small>
    </button>
    <button class="game-btn" onclick="game.endMonth()">
      🗓️ End Month
      <small>Pay Rent</small>
    </button>
  </div>

  <div id="event-modal">
    <h2 id="modal-title">Macro Event</h2>
    <p id="modal-desc">Event description...</p>
    <div id="modal-choices" class="modal-choices"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // --- 1. Scene & Camera Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c13);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(13, 11, 13);
    camera.lookAt(0, 1.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // --- 2. Atmospheric Lighting ---
    const ambientLight = new THREE.AmbientLight(0x28324e, 1.2);
    scene.add(ambientLight);

    // Room Ceiling Warm Lamp
    const ceilingLight = new THREE.PointLight(0xffecd1, 1.8, 14);
    ceilingLight.position.set(0, 6, 0);
    ceilingLight.castShadow = true;
    scene.add(ceilingLight);

    // Cool Window Light
    const windowLight = new THREE.DirectionalLight(0x5ca0d3, 1.2);
    windowLight.position.set(-10, 8, -6);
    windowLight.castShadow = true;
    scene.add(windowLight);

    // Screen Glow (Cyan/Blue CRT monitor light)
    const monitorLight = new THREE.PointLight(0x38bdf8, 2.2, 4);
    monitorLight.position.set(-2, 2.4, -2.4);
    scene.add(monitorLight);

    // --- 3. Room Geometry (Walls & Floor) ---
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x221a15, roughness: 0.8 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x242d38, roughness: 0.9 });

    // Floor
    const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.4, 9), floorMat);
    floor.position.y = -0.2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Back Wall (Left)
    const backWallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.3, 6, 9), wallMat);
    backWallLeft.position.set(-4.5, 2.8, 0);
    backWallLeft.receiveShadow = true;
    scene.add(backWallLeft);

    // Back Wall (Right)
    const backWallRight = new THREE.Mesh(new THREE.BoxGeometry(9, 6, 0.3), wallMat);
    backWallRight.position.set(0, 2.8, -4.5);
    backWallRight.receiveShadow = true;
    scene.add(backWallRight);

    // Window Frame on Right Wall
    const winFrameMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
    const winGlassMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 });
    const winGlass = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 3), winGlassMat);
    winGlass.position.set(1.5, 3.2, -4.34);
    scene.add(winGlass);

    // Rug
    const rug = new THREE.Mesh(
      new THREE.PlaneGeometry(4.5, 3.5),
      new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 1.0 })
    );
    rug.rotation.x = -Math.PI / 2;
    rug.position.set(0, 0.01, 0.5);
    rug.receiveShadow = true;
    scene.add(rug);

    // --- 4. Furniture & Props ---
    // Desk
    const deskMat = new THREE.MeshStandardMaterial({ color: 0x3e2723 });
    const desk = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.4, 1.6), deskMat);
    desk.position.set(-2.4, 0.7, -2.8);
    desk.castShadow = true;
    desk.receiveShadow = true;
    scene.add(desk);

    // Computer Monitor
    const monitor = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 0.9, 0.1),
      new THREE.MeshStandardMaterial({ color: 0x0f172a })
    );
    monitor.position.set(-2.4, 1.9, -3.1);
    scene.add(monitor);

    // Glowing Screen
    const screen = new THREE.Mesh(
      new THREE.PlaneGeometry(1.3, 0.8),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
    );
    screen.position.set(-2.4, 1.9, -3.04);
    scene.add(screen);

    // Desk Chair
    const chairMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
    const chair = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), chairMat);
    chair.position.set(-2.4, 0.6, -1.5);
    chair.castShadow = true;
    scene.add(chair);

    // Bed
    const bedFrame = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.6, 4.4), deskMat);
    bedFrame.position.set(2.8, 0.3, -2);
    scene.add(bedFrame);

    const mattress = new THREE.Mesh(
      new THREE.BoxGeometry(2.4, 0.5, 4.2),
      new THREE.MeshStandardMaterial({ color: 0x334155 })
    );
    mattress.position.set(2.8, 0.7, -2);
    mattress.castShadow = true;
    scene.add(mattress);

    const pillow = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.2, 0.8),
      new THREE.MeshStandardMaterial({ color: 0xe2e8f0 })
    );
    pillow.position.set(2.8, 1.0, -3.5);
    scene.add(pillow);

    // --- 5. Character Seated at the Desk ---
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xe0a98b });
    const clothMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });

    const characterGroup = new THREE.Group();

    // Torso
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.5), clothMat);
    torso.position.set(0, 1.5, 0);
    characterGroup.add(torso);

    // Head
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), skinMat);
    head.position.set(0, 2.2, 0);
    characterGroup.add(head);

    // Position Character in front of screen
    characterGroup.position.set(-2.4, 0, -1.6);
    characterGroup.rotation.y = 0;
    scene.add(characterGroup);

    // Clutter/Bills pile that spawns when in debt
    const billGroup = new THREE.Group();
    const paperMat = new THREE.MeshStandardMaterial({ color: 0xfef08a });
    for (let i = 0; i < 6; i++) {
      const paper = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.5), paperMat);
      paper.rotation.x = -Math.PI / 2;
      paper.rotation.z = (Math.random() - 0.5) * 1.5;
      paper.position.set(-1.4 + (Math.random() - 0.5) * 0.4, 0.02 + i * 0.005, -2.6 + (Math.random() - 0.5) * 0.4);
      billGroup.add(paper);
    }
    scene.add(billGroup);

    // --- 6. Render Loop ---
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Subtle breathing animation on character
      torso.position.y = 1.5 + Math.sin(t * 2) * 0.02;
      head.position.y = 2.2 + Math.sin(t * 2) * 0.02;

      // Monitor flicker / pulse
      monitorLight.intensity = 2.0 + Math.sin(t * 6) * 0.3;

      // Smooth camera bob
      camera.position.y = 11 + Math.sin(t * 0.4) * 0.2;
      camera.lookAt(0, 1.2, 0);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 7. Game State Engine ---
    class BankruptGame {
      constructor() {
        this.year = 2008;
        this.monthIndex = 0;
        this.months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        
        this.cash = 1200;
        this.debt = 2500;
        this.energy = 100;
        this.rent = 600;
        this.livingCost = 250;
        this.debtInterest = 0.03;
        this.btcHoldings = 0;

        this.timelineEvents = [
          {
            year: 2008, month: "Sep",
            title: "Wall Street Turmoil (September 2008)",
            desc: "Lehman Brothers collapses. Credit dries up globally. Your landlord pushes rent higher to cover his own mortgages.",
            choices: [
              { text: "Accept rent hike & work extra (+Rent, -Energy)", action: () => { this.rent += 150; this.energy -= 20; } },
              { text: "Cut food & essentials strictly (-Living Cost)", action: () => { this.livingCost -= 60; this.energy -= 10; } }
            ]
          },
          {
            year: 2009, month: "Jan",
            title: "Genesis: Chancellor on Brink of Second Bailout",
            desc: "Newspaper headline: 'The Times 03/Jan/2009 Chancellor on brink of second bailout for banks'. A cryptography forum announces a decentralized peer-to-peer money called Bitcoin.",
            choices: [
              { text: "Ignore: 'Just internet play-money.'", action: () => {} },
              { text: "Mine on home PC (-$50 Electric, +50 BTC)", action: () => { this.cash -= 50; this.btcHoldings += 50; } }
            ]
          }
        ];

        this.updateHUD();
      }

      updateHUD() {
        document.getElementById('date-val').innerText = `${this.months[this.monthIndex]} ${this.year}`;
        document.getElementById('cash-val').innerText = `$${Math.round(this.cash).toLocaleString()}`;
        document.getElementById('debt-val').innerText = `$${Math.round(this.debt).toLocaleString()}`;
        document.getElementById('energy-val').innerText = `${Math.max(0, this.energy)}%`;

        const statusEl = document.getElementById('status-val');
        statusEl.className = "status-badge ";

        if (this.cash <= 0 && this.debt > 4000) {
          statusEl.innerText = "BANKRUPTT";
          statusEl.classList.add("status-bankrupt");
          billGroup.visible = true;
        } else if (this.cash < 200 || this.debt > 3000) {
          statusEl.innerText = "BROKE";
          statusEl.classList.add("status-broke");
          billGroup.visible = true;
        } else if (this.debt > 1500) {
          statusEl.innerText = "IN DEBT";
          statusEl.classList.add("status-debt");
          billGroup.visible = true;
        } else if (this.cash < 1000) {
          statusEl.innerText = "STRUGGLING";
          statusEl.classList.add("status-struggling");
          billGroup.visible = false;
        } else {
          statusEl.innerText = "STABLE";
          statusEl.classList.add("status-stable");
          billGroup.visible = false;
        }
      }

      work() {
        if (this.energy < 20) {
          alert("Exhausted. Rest first.");
          return;
        }
        this.cash += 350;
        this.energy -= 25;
        this.updateHUD();
      }

      rest() {
        if (this.cash < 40) {
          alert("Not enough money for groceries.");
          return;
        }
        this.cash -= 40;
        this.energy = Math.min(100, this.energy + 30);
        this.updateHUD();
      }

      payDebt() {
        if (this.cash < 300) {
          alert("Need at least $300 cash.");
          return;
        }
        this.cash -= 300;
        this.debt = Math.max(0, this.debt - 300);
        this.updateHUD();
      }

      endMonth() {
        if (this.debt > 0) {
          this.debt += Math.round(this.debt * this.debtInterest);
        }

        const totalExpenses = this.rent + this.livingCost;
        this.cash -= totalExpenses;

        if (this.cash < 0) {
          this.debt += Math.abs(this.cash);
          this.cash = 0;
        }

        this.monthIndex++;
        if (this.monthIndex >= 12) {
          this.monthIndex = 0;
          this.year++;
        }

        this.energy = Math.min(100, this.energy + 10);
        this.updateHUD();
        this.checkHistoricalEvents();
      }

      checkHistoricalEvents() {
        const currentMonthName = this.months[this.monthIndex];
        const event = this.timelineEvents.find(e => e.year === this.year && e.month === currentMonthName);
        if (event) this.showModal(event);
      }

      showModal(event) {
        const modal = document.getElementById('event-modal');
        document.getElementById('modal-title').innerText = event.title;
        document.getElementById('modal-desc').innerText = event.desc;
        const choicesContainer = document.getElementById('modal-choices');
        choicesContainer.innerHTML = "";

        event.choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.innerText = choice.text;
          btn.onclick = () => {
            choice.action();
            modal.style.display = "none";
            this.updateHUD();
          };
          choicesContainer.appendChild(btn);
        });

        modal.style.display = "block";
      }
    }

    window.game = new BankruptGame();
  </script>
</body>
</html>
