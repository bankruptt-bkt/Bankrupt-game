<script>

/* ==================================================
PLAYER
================================================== */

const player =
document.getElementById("player");

const world =
document.getElementById("world");

const interactButton =
document.getElementById("interact");

const message =
document.getElementById("message");

const menu =
document.getElementById("menu");

const menuTitle =
document.getElementById("menuTitle");

const menuText =
document.getElementById("menuText");

const actionButton =
document.getElementById("actionButton");


let x = 350;

let y = 580;

let velocityY = 0;

const speed = 6;

const gravity = 0.8;

const jumpPower = -15;

let onGround = false;


/* ==================================================
GAME STATE
================================================== */

let jobUnlocked = false;

let workedToday = false;


/* ==================================================
FINANCIAL STATE
================================================== */

let money = 500;

let hunger = 100;

let energy = 100;

let debt = 0;


/* ==================================================
TIME
================================================== */

let day = 1;

let hour = 8;

let minute = 0;


/* ==================================================
ECONOMY
================================================== */

let inflation = 0;

let rent = 180;

const baseFoodPrice = 20;

const baseRent = 180;


/* ==================================================
CONTROLS
================================================== */

const keys = {

left:false,

right:false

};


/* ==================================================
HUD
================================================== */

function updateHUD(){

document.getElementById("money")
.innerText =
Math.floor(money);

document.getElementById("hunger")
.innerText =
Math.floor(hunger);

document.getElementById("energy")
.innerText =
Math.floor(energy);

document.getElementById("debt")
.innerText =
Math.floor(debt);

document.getElementById("inflation")
.innerText =
inflation;

document.getElementById("rent")
.innerText =
rent;

document.getElementById("day")
.innerText =
day;

document.getElementById("time")
.innerText =

String(hour).padStart(2,"0")
+
":" +
String(minute).padStart(2,"0");


let daysUntilRent =
3 - ((day - 1) % 3);

if(daysUntilRent === 0){

daysUntilRent = 3;

}

document.getElementById("rentDue")
.innerText =
daysUntilRent;


}


/* ==================================================
FOOD PRICE
================================================== */

function getFoodPrice(){

return Math.round(
baseFoodPrice *
(1 + inflation / 100)
);

}


/* ==================================================
INFLATION
================================================== */

function updateInflation(){

/*
Every 3 days inflation increases.
*/

inflation =
Math.floor(
(day - 1) / 3
) * 5;


/*
Rent slowly increases too.
*/

rent =
Math.round(
baseRent *
(1 + inflation / 100)
);

}


/* ==================================================
TIME
================================================== */

function advanceTime(hours){

hour += hours;

if(hour >= 24){

hour -= 24;

}


/*
Every hour:

Hunger decreases.

Energy decreases slightly.
*/

hunger =
Math.max(
0,
hunger - (hours * 2)
);

energy =
Math.max(
0,
energy - (hours * 0.5)
);


updateLighting();

updateHUD();

}


/* ==================================================
LIGHTING
================================================== */

function updateLighting(){

if(hour >= 19 || hour < 6){

world.style.filter =
"brightness(.42)";

}
else if(hour >= 17){

world.style.filter =
"brightness(.7)";

}
else{

world.style.filter =
"brightness(1)";

}

}


/* ==================================================
RENT
================================================== */

function processRent(){

/*
Rent every 3 days.

Day 3
Day 6
Day 9
etc.
*/

if(day % 3 !== 0){

return;

}


if(money >= rent){

money -= rent;

showMessage(

"🏠 <b>RENT PAID</b><br><br>" +

"-$" + rent +
"<br><br>" +

"Rent for Day " +
day +
" has been paid."

);

}
else{

let unpaid =
rent - money;

money = 0;

debt += unpaid;

showMessage(

"⚠️ <b>RENT MISSED</b><br><br>" +

"Rent: $" + rent +
"<br>" +

"Unpaid: $" + unpaid +
"<br><br>" +

"💳 The unpaid amount has become debt."

);

}


/*
Debt interest.

5% every rent cycle.
*/

if(debt > 0){

let interest =
Math.ceil(
debt * 0.05
);

debt += interest;

}


/*
Update economy.

*/

updateInflation();

updateHUD();

}


/* ==================================================
NEW DAY
================================================== */

function startNewDay(){

day++;

workedToday = false;

hour = 8;

minute = 0;

energy = 100;


/*
Hunger continues to decrease overnight.
*/

hunger =
Math.max(
0,
hunger - 10
);


/*
Update inflation BEFORE rent calculation.
*/

updateInflation();

processRent();

updateLighting();

updateHUD();


if(jobUnlocked){

document.getElementById(
"missionTitle"
).innerText =
"MISSION: WORK";

document.getElementById(
"missionText"
).innerText =
"Go to the Job Center and start your shift.";

}
else{

document.getElementById(
"missionTitle"
).innerText =
"MISSION: FIND A JOB";

document.getElementById(
"missionText"
).innerText =
"Go to the Job Center.";

}


if(day === 2){

showMessage(

"🌅 <b>DAY 2</b><br><br>" +

"Your first morning begins.<br>" +

"You need to work to survive."

);

}
else{

showMessage(

"🌅 <b>DAY " +
day +
"</b><br><br>" +

"Another day begins."

);

}

}


/* ==================================================
GAME LOOP
================================================== */

function update(){

if(keys.left){

x -= speed;

}

if(keys.right){

x += speed;

}


/* GRAVITY */

velocityY += gravity;

y += velocityY;


/* GROUND */

if(y >= 580){

y = 580;

velocityY = 0;

onGround = true;

}
else{

onGround = false;

}


/* WORLD LIMIT */

x =
Math.max(
0,
Math.min(
2950,
x
)
);


/* PLAYER */

player.style.left =
x + "px";

player.style.top =
y + "px";


/* CAMERA */

const screenWidth =
window.innerWidth;

let cameraX =
x - screenWidth / 2;

cameraX =
Math.max(
0,
Math.min(
3000 - screenWidth,
cameraX
)
);

world.style.transform =
`translateX(${-cameraX}px)`;


/* INTERACTION RANGE */


/*
HOME
*/

if(
x > 50 &&
x < 500
){

interactButton.style.display =
"block";

}


/*
GROCERY
*/

else if(
x > 750 &&
x < 1250
){

interactButton.style.display =
"block";

}


/*
JOB CENTER
*/

else if(
x > 1450 &&
x < 1950
){

interactButton.style.display =
"block";

}


/*
BANK
*/

else if(
x > 2150 &&
x < 2650
){

interactButton.style.display =
"block";

}


/*
NOTHING
*/

else{

interactButton.style.display =
"none";

}


requestAnimationFrame(update);

}

update();


/* ==================================================
JUMP
================================================== */

function jump(){

if(onGround){

velocityY =
jumpPower;

onGround = false;

}

}


/* ==================================================
INTERACTION
================================================== */

function interact(){


/*
HOME
*/

if(
x > 50 &&
x < 500
){

openHome();

return;

}


/*
GROCERY
*/

if(
x > 750 &&
x < 1250
){

openGrocery();

return;

}


/*
JOB CENTER
*/

if(
x > 1450 &&
x < 1950
){

openJobCenter();

return;

}


/*
BANK
*/

if(
x > 2150 &&
x < 2650
){

openBank();

return;

}

}


/* ==================================================
JOB CENTER
================================================== */

function openJobCenter(){

if(!jobUnlocked){

menuTitle.innerText =
"🏢 JOB CENTER";

menuText.innerText =

"Apply for a basic job.<br><br>" +

"💼 Salary: $100/day<br>" +

"⚡ Work energy cost: 20";

actionButton.innerText =
"APPLY FOR JOB";


actionButton.onclick =
function(){

jobUnlocked = true;

menu.style.display =
"none";

document.getElementById(
"missionTitle"
).innerText =
"MISSION: WORK";

document.getElementById(
"missionText"
).innerText =
"Start your first shift.";

showMessage(

"💼 <b>JOB ACCEPTED</b><br><br>" +

"Salary: $100/day<br>" +

"Now you need to survive."

);

};

}
else{

menuTitle.innerText =
"🏢 JOB CENTER";


if(workedToday){

menuText.innerHTML =

"Today's shift is already complete.<br><br>" +

"Come back tomorrow.";

actionButton.innerText =
"SHIFT COMPLETE";

actionButton.onclick =
function(){};

}
else{

menuText.innerHTML =

"Your job is waiting.<br><br>" +

"💵 Salary: $100<br>" +

"⚡ Energy cost: 20";

actionButton.innerText =
"START WORK";


actionButton.onclick =
function(){

if(energy < 20){

menu.style.display =
"none";

showMessage(

"⚡ <b>TOO TIRED</b><br><br>" +

"You don't have enough energy to work.<br>" +

"Go home and sleep."

);

return;

}


/*
WORK
*/

workedToday = true;

money += 100;

energy =
Math.max(
0,
energy - 20
);

hunger =
Math.max(
0,
hunger - 10
);

advanceTime(8);

menu.style.display =
"none";

updateHUD();

showMessage(

"💼 <b>SHIFT COMPLETE</b><br><br>" +

"Salary received: <b>+$100</b><br><br>" +

"⚡ Energy: -20<br>" +

"🍔 Hunger: -10"

);


/*
MISSION
*/

document.getElementById(
"missionTitle"
).innerText =
"MISSION: MANAGE YOUR MONEY";

document.getElementById(
"missionText"
).innerText =
"Buy food if needed and return home.";

};

}

}

menu.style.display =
"block";

}


/* ==================================================
GROCERY
================================================== */

function openGrocery(){

let foodPrice =
getFoodPrice();

menuTitle.innerText =
"🛒 GROCERY STORE";

menuText.innerHTML =

"📈 Inflation: " +
inflation +
"%<br><br>" +

"🍞 Today's food price: <b>$" +
foodPrice +
"</b>";

actionButton.innerText =
"BUY FOOD — $" + foodPrice;


actionButton.onclick =
function(){

if(money < foodPrice){

menu.style.display =
"none";

showMessage(

"❌ <b>NOT ENOUGH MONEY</b><br><br>" +

"Food costs $" +
foodPrice +
"<br>" +

"You only have $" +
Math.floor(money) +
"."

);

return;

}


money -= foodPrice;

hunger =
Math.min(
100,
hunger + 40
);

advanceTime(1);

menu.style.display =
"none";

updateHUD();

showMessage(

"🍞 <b>FOOD PURCHASED</b><br><br>" +

"-$" +
foodPrice +
"<br><br>" +

"🍔 Hunger restored."

);

};

menu.style.display =
"block";

}


/* ==================================================
HOME
================================================== */

function openHome(){

menuTitle.innerText =
"🏠 HOME";

menuText.innerHTML =

"Rest and prepare for tomorrow.<br><br>" +

"⚡ Energy will be restored.";

actionButton.innerText =
"SLEEP";


actionButton.onclick =
function(){

menu.style.display =
"none";

startNewDay();

};

menu.style.display =
"block";

}


/* ==================================================
BANK
================================================== */

function openBank(){

menuTitle.innerText =
"🏦 BANK";

menuText.innerHTML =

"Welcome to the bank.<br><br>" +

"💳 Current debt: $" +
Math.floor(debt) +
"<br><br>" +

"Loans are currently unavailable.";

actionButton.innerText =
"OK";

actionButton.onclick =
function(){

menu.style.display =
"none";

};

menu.style.display =
"block";

}


/* ==================================================
MESSAGE
================================================== */

function showMessage(text){

message.innerHTML =
text;

message.style.display =
"block";


setTimeout(
function(){

message.style.display =
"none";

},
4000
);

}


message.addEventListener(
"click",
function(){

message.style.display =
"none";

}
);


/* ==================================================
KEYBOARD
================================================== */

document.addEventListener(
"keydown",
function(e){

if(
e.key === "ArrowLeft" ||
e.key === "a"
){

keys.left = true;

}


if(
e.key === "ArrowRight" ||
e.key === "d"
){

keys.right = true;

}


if(
e.key === "ArrowUp" ||
e.key === "w" ||
e.key === " "
){

jump();

}


if(e.key === "Enter"){

interact();

}

});


document.addEventListener(
"keyup",
function(e){

if(
e.key === "ArrowLeft" ||
e.key === "a"
){

keys.left = false;

}


if(
e.key === "ArrowRight" ||
e.key === "d"
){

keys.right = false;

}

});


/* ==================================================
MOBILE MOVEMENT
================================================== */

function holdButton(
id,
direction
){

const button =
document.getElementById(id);


button.addEventListener(
"touchstart",
function(e){

e.preventDefault();

keys[direction] = true;

}
);


button.addEventListener(
"touchend",
function(e){

e.preventDefault();

keys[direction] = false;

}
);


button.addEventListener(
"mousedown",
function(){

keys[direction] = true;

}
);


button.addEventListener(
"mouseup",
function(){

keys[direction] = false;

}
);

}


holdButton(
"left",
"left"
);

holdButton(
"right",
"right"
);


/* ==================================================
